<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Lidward logo">
  <defs>
    <pattern id="paper-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#241C17" opacity="0.10"/>
    </pattern>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="2" fill="#000000" opacity="0.20"/>
    </pattern>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>

  <!-- Warm paper tile -->
  <rect width="1024" height="1024" rx="220" fill="#F2E7D0"/>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#paper-dots)"/>

    <!-- Retro sunburst -->
    <circle cx="512" cy="500" r="330" fill="#E3A72F"/>
    <g stroke="#D95D39" stroke-width="26" stroke-linecap="round">
      <path d="M512 126 V216"/>
      <path d="M306 196 L356 276"/>
      <path d="M718 196 L668 276"/>
      <path d="M186 386 H276"/>
      <path d="M838 386 H748"/>
    </g>

    <!-- Offset shadow -->
    <rect x="286" y="238" width="480" height="520" rx="38" fill="#241C17" opacity="0.22"/>

    <!-- Classic beige computer -->
    <rect x="272" y="220" width="480" height="520" rx="38" fill="#E8D3AC" stroke="#241C17" stroke-width="16"/>

    <!-- Screen bezel -->
    <rect x="312" y="260" width="400" height="300" rx="20" fill="#D8BE91" stroke="#241C17" stroke-width="12"/>

    <!-- CRT screen -->
    <rect x="340" y="288" width="344" height="244" rx="10" fill="#0E2A1D" stroke="#241C17" stroke-width="10"/>

    <!-- Pixel eye -->
    <g fill="#8CFF9E">
      <rect x="430" y="372" width="164" height="16"/>
      <rect x="400" y="388" width="224" height="16"/>
      <rect x="384" y="404" width="256" height="16"/>
      <rect x="400" y="420" width="224" height="16"/>
      <rect x="430" y="436" width="164" height="16"/>
    </g>
    <rect x="488" y="388" width="48" height="48" fill="#0E2A1D"/>
    <rect x="500" y="396" width="12" height="12" fill="#F2E7D0"/>

    <!-- CRT scanlines and glare -->
    <rect x="340" y="288" width="344" height="244" rx="10" fill="url(#scanlines)"/>
    <path d="M360 300 L420 300 L380 520 L320 520 Z" fill="#FFFFFF" opacity="0.06"/>

    <!-- Floppy slot -->
    <rect x="340" y="586" width="128" height="16" rx="8" fill="#241C17"/>
    <rect x="348" y="590" width="40" height="8" rx="4" fill="#D95D39"/>

    <!-- Vents -->
    <g fill="#241C17">
      <rect x="600" y="588" width="80" height="10" rx="5"/>
      <rect x="600" y="608" width="80" height="10" rx="5"/>
      <rect x="600" y="628" width="80" height="10" rx="5"/>
    </g>

    <!-- Retro stripe -->
    <g>
      <rect x="340" y="648" width="40" height="12" rx="6" fill="#D95D39"/>
      <rect x="388" y="648" width="40" height="12" rx="6" fill="#E3A72F"/>
      <rect x="436" y="648" width="40" height="12" rx="6" fill="#F2E7D0" stroke="#241C17" stroke-width="4"/>
    </g>

    <!-- Nameplate -->
    <text x="602" y="662" text-anchor="middle" font-family="Menlo, ui-monospace, monospace" font-size="26" font-weight="700" letter-spacing="4" fill="#241C17">LIDWARD</text>

    <!-- Base -->
    <rect x="240" y="720" width="544" height="64" rx="30" fill="#D8BE91" stroke="#241C17" stroke-width="14"/>
    <rect x="300" y="744" width="424" height="10" rx="5" fill="#241C17" opacity="0.35"/>
    <rect x="700" y="742" width="16" height="16" rx="4" fill="#8CFF9E" stroke="#241C17" stroke-width="4"/>
  </g>

  <!-- Sticker border -->
  <rect x="10" y="10" width="1004" height="1004" rx="212" fill="none" stroke="#241C17" stroke-width="20"/>
</svg>
